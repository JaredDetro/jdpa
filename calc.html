<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>

<script>
function add() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) + Number(b);
document.getElementById("ans").innerHTML=c;
}

function subtract() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) - Number(b);
document.getElementById("ans").innerHTML=c;
}

function multiply() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) * Number(b);
document.getElementById("ans").innerHTML=c;
}

function divide() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) / Number(b);
document.getElementById("ans").innerHTML=c;
}

function exponent() {
let a = document.getElementById("fn").value;
let b = document.getElementById("sn").value;
let c = Number(a) ** Number(b);
document.getElementById("ans").innerHTML=c;
}
</script>

</head>
<body>

<h3>This is a sample JavaScript and HTML Document.</h3>

<p>Enter your first number: <input id="fn"> <br>
Enter your second number: <input id="sn"> <br>
<button onclick="add()">+</button>
<button onclick="subtract()">-</button>
<button onclick="multiply()">*</button>
<button onclick="divide()">/</button>
<button onclick="exponent()">^</button>
</p>
<p>
  The total is: <span id="ans">__________</span>
</p>

  
</body>
</html>

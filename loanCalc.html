<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>

<script>
function findValue() {
let presentValue = document.getElementById("fn").value;
let rate = document.getElementById("sn").value;
let numYears = document.getElementById("tn").value;
let p = ((rate/100/12)*presentValue)/(1-(1+(rate/100/12))**-(numYears*12));
document.getElementById("ans").innerHTML=p;
}
</script>

</head>
<body>

<h3>Welcome to the Loan Calculator!</h3>

<p><input id="fn"> Present Value — Amount you wish to borrow <br>
   <input id="sn"> Years <input id="sn"> <br>
   <input id="tn"> % — Annual Interest Rate <br>
<button onclick="add()">Calculate the Monthly Payment</button>
</p>
<p>
  The total is: <span id="ans">__________</span>
</p>

  
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>

<script>
function findValue() {
let presentValue = document.getElementById("fn").value;
let rate = document.getElementById("sn").value;
let numYears = document.getElementById("tn").value;
let p = ((rate/100/12)*presentValue)/(1-(1+(rate/100/12))**-(numYears*12));
document.getElementById("ans").innerHTML = `If you have a $${presentValue} loan for ${numYears} years at ${rate}% interest, your monthly payment will be $${p.toFixed(2)}.`;
}
</script>

</head>
<body>

<h3>Welcome to the Loan Calculator!</h3>

<p><input id="fn"> Present Value — Amount you wish to borrow <br>
   <input id="tn"> Years <br>
   <input id="sn"> % — Annual Interest Rate <br>
<button onclick="findValue()">Calculate the Monthly Payment</button>
</p>
<p>
  <span id="ans">__________</span>
</p>

  
</body>
</html>
